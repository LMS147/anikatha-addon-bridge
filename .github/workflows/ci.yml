name: .NET CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run offline tests
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/AniKathaAddonBridge.Tests/AniKathaAddonBridge.Tests.csproj --configuration Release 2>&1 | tee /tmp/dotnet-test.log || {
            while IFS= read -r line; do echo "::error::$line"; done < <(tail -30 /tmp/dotnet-test.log)
            exit 1
          }
