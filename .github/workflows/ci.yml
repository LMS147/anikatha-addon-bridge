name: Worker CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Local Worker smoke (no upstream calls)
        shell: bash
        run: |
          WRANGLER_SEND_METRICS=false npm run dev -- --ip 127.0.0.1 --port 8787 > /tmp/worker.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:8787/anikatha/manifest.json -o /tmp/manifest.json
          node -e 'const m=require("/tmp/manifest.json"); if (m.anikathaProtocolVersion!==1 || m.types.join(",")!=="anime,manga") process.exit(1)'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/anikatha/stream/anime/ep%3Anone.json)" = 404
