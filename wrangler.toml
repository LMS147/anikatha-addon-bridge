name = "anikatha-addon-bridge"
main = "src/index.ts"
compatibility_date = "2026-07-30"

# KV cache for the deployed Cloudflare account.
[[kv_namespaces]]
binding = "CACHE"
id = "52b7b9b0ca8e42f1828449770977f215"

[[durable_objects.bindings]]
name = "RATE_GATE"
class_name = "RateGate"

[[durable_objects.bindings]]
name = "PAGE_STORE"
class_name = "PageStore"

[[durable_objects.bindings]]
name = "REPORT_QUEUE"
class_name = "ReportQueue"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateGate"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PageStore"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ReportQueue"]
